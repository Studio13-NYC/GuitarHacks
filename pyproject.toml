[project]
name = "guitarhacks"
version = "0.1.0"
description = "Local, single-note guitar practice monitoring"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2,<3",
    "pyside6-essentials>=6.12.0",
    "pyside6-addons>=6.12.0",
    "pyside6-webengine>=6.12.0.140",
    "pywin32>=312",
    "sounddevice>=0.5,<0.6",
    "mido>=1.3,<2",
    "tinysoundfont==0.3.7",
]

[tool.uv]
package = false

[dependency-groups]
build = [
    "pyinstaller>=6.22.3",
    "python-rtmidi>=1.5,<2",
]
